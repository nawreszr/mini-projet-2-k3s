<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8"><title>Mini-Projet 2</title>
    <style>body { font-family: sans-serif; margin: 40px; } li { margin: 10px 0; background: #eee; padding: 10px; }</style>
</head>
<body>
    <h1>Gestionnaire de Tâches</h1>
    <input type="text" id="taskInput" placeholder="Nouvelle tâche...">
    <button onclick="addTask()">Ajouter</button>
    <ul id="taskList"></ul>
    <script>
        const API_URL = '/api/tasks';
        async function loadTasks() {
            const res = await fetch(API_URL);
            const tasks = await res.json();
            document.getElementById('taskList').innerHTML = tasks.map(t => `<li>${t.title} <button onclick="deleteTask(${t.id})">X</button></li>`).join('');
        }
        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value) return;
            await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: input.value }) });
            input.value = ''; loadTasks();
        }
        async function deleteTask(id) { await fetch(`${API_URL}/${id}`, { method: 'DELETE' }); loadTasks(); }
        loadTasks();
    </script>
</body>
</html>
