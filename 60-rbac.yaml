apiVersion: v1
kind: ServiceAccount
metadata:
  name: dev-viewer
  namespace: mini-projet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer-role
  namespace: mini-projet
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "services"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: viewer-binding
  namespace: mini-projet
subjects:
- kind: ServiceAccount
  name: dev-viewer
  namespace: mini-projet
roleRef:
  kind: Role
  name: viewer-role
  apiGroup: rbac.authorization.k8s.io
