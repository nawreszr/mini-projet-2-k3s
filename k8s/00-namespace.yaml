apiVersion: v1
kind: Namespace
metadata:
  name: mini-projet
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: projet-quota
  namespace: mini-projet
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "4"
    limits.memory: 4Gi
    pods: "10"
    persistentvolumeclaims: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: projet-limits
  namespace: mini-projet
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 200m
        memory: 256Mi
