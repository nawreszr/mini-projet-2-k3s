apiVersion: v1
kind: Pod
metadata:
  name: lecteur-backup
  namespace: mini-projet
spec:
  containers:
    - name: lecteur
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: backup
          mountPath: /backup
  volumes:
    - name: backup
      persistentVolumeClaim:
        claimName: backup-pvc
